document.addEventListener('pointerdown',function(e){if(!SWV||SWV.lock)return;var stg=e.target.closest&&e.target.closest('.swstage');if(!stg||SWV.el.querySelector('.swcard').hidden)return;
SWV.d={x0:e.clientX,y0:e.clientY,id:e.pointerId,t:Date.now(),dx:0,dy:0,tx:SWV.z?SWV.z.tx:0,ty:SWV.z?SWV.z.ty:0};try{stg.setPointerCapture(e.pointerId)}catch(er){}});
document.addEventListener('pointermove',function(e){if(!SWV||!SWV.d||e.pointerId!==SWV.d.id)return;var d=SWV.d;d.dx=e.clientX-d.x0;d.dy=e.clientY-d.y0;
var img=SWV.el.querySelector('.swcard img');if(SWV.z){SWV.z.tx=d.tx+d.dx;SWV.z.ty=d.ty+d.dy;img.style.transform='translate('+SWV.z.tx+'px,'+SWV.z.ty+'px) scale('+SWV.z.s+')';return}
var card=SWV.el.querySelector('.swcard');card.style.transition='none';card.style.transform='translate('+d.dx+'px,'+Math.min(0,d.dy)*.9+'px) rotate('+(d.dx/22)+'deg)';swLabels(d.dx,d.dy)});
function swUp(e){if(!SWV||!SWV.d||e.pointerId!==SWV.d.id)return;var d=SWV.d;SWV.d=null;var moved=Math.hypot(d.dx,d.dy),card=SWV.el.querySelector('.swcard');
if(moved<10&&Date.now()-d.t<300){var now=Date.now();if(SWV.tap&&now-SWV.tap.t<320&&Math.hypot(e.clientX-SWV.tap.x,e.clientY-SWV.tap.y)<40){SWV.tap=null;swZoom(e.clientX,e.clientY)}else SWV.tap={t:now,x:e.clientX,y:e.clientY};return}
if(SWV.z)return;var th=Math.min(120,window.innerWidth*.22);
if(d.dx>th&&Math.abs(d.dx)>Math.abs(d.dy))swAct('ok');else if(d.dx<-th&&Math.abs(d.dx)>Math.abs(d.dy))swAct('no');else if(d.dy<-th)swAct('sk');
else{card.style.transition='transform .18s ease-out';card.style.transform='';swLabels(0,0)}}

function swZoom(cx,cy){var img=SWV.el.querySelector('.swcard img');if(SWV.z){SWV.z=null;img.style.transform='';img.style.transformOrigin='';return}
var r=img.getBoundingClientRect();if(!r.width)return;var ox=Math.max(0,Math.min(100,(cx-r.left)/r.width*100)),oy=Math.max(0,Math.min(100,(cy-r.top)/r.height*100));
SWV.z={s:3,tx:0,ty:0};img.style.transformOrigin=ox+'% '+oy+'%';img.style.transform='scale(3)'}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-sw],[data-sws]');if(!b||!SWV)return;var k=b.getAttribute('data-sw'),sv=b.getAttribute('data-sws'),p=swCur();
if(sv&&p){var n=+sv;p.st=(p.st===n?0:n);SWV.el.querySelector('.swinfo').innerHTML=swInfo(p);saveSoon();return}
if(k==='x')swClose();else if(k==='u')swUndo();else if(k==='ok'||k==='no'||k==='sk')swAct(k);else if(k==='cli'){if(p)cliOpen(p)}else if(k==='exp'){swClose();exportOk()}});

if(k==='ArrowRight'){e.preventDefault();swAct('ok')}else if(k==='ArrowLeft'){e.preventDefault();swAct('no')}else if(k==='ArrowUp'){e.preventDefault();swAct('sk')}
else if(k==='Backspace'||k==='z'){e.preventDefault();swUndo()}else if(k==='Escape')swClose();else if(/^[1-5]$/.test(k)){var p=swCur();if(p){var n=+k;p.st=(p.st===n?0:n);SWV.el.querySelector('.swinfo').innerHTML=swInfo(p);saveSoon()}}});

function syncTargets(k,p){var L=live().filter(function(x){return!x.vid&&x.id!==p.id});if(k==='ok')return L.filter(function(x){return st(x)==='ok'});if(k==='rev')return L.filter(function(x){return st(x)!=='ok'});if(k==='seq'){groupBursts();return L.filter(function(x){return p.g&&x.g===p.g})}return L}
function copyE(src,dst,o){var e=JSON.parse(JSON.stringify(src)),ne=Object.assign(E0(),e);if(!o.crop){ne.r=dst.r||0;ne.ang=dst.ang||0;ne.asp=dst.asp||0}
if(o.mk){ne.mk=(dst.mk||[]).filter(function(m){return m.type!=='ai'}).concat((e.mk||[]).filter(function(m){return m.type==='ai'}).map(function(m){m.id='m'+Date.now()+Math.random().toString(36).slice(2,6);delete m.box;return m}))}else ne.mk=dst.mk||[];return ne}

'<div class="seg" style="flex-wrap:wrap"><button type="button" data-x="syncrop" aria-pressed="'+o.crop+'" style="flex:1 1 40%">'+(o.crop?'✓ ':'')+'Corte e giro</button><button type="button" data-x="syncmk" aria-pressed="'+o.mk+'" style="flex:1 1 40%">'+(o.mk?'✓ ':'')+'Máscaras automáticas</button></div>'+
'<p class="note">Luz, cor, perfil, look, curva, detalhe e efeitos vão para as fotos escolhidas. Máscaras pintadas à mão ficam só nesta foto.</p><div class="row"><button type="button" class="btn" data-x="syncx">Cancelar</button><button type="button" class="btn p" data-x="syncgo">Aplicar em '+syncTargets(o.k,p).length+'</button></div></div>'}

/* ---------- venda na hora: mostrar ao cliente com QR Code ---------- */
var CLI=null;
function cliCode(p){return(p.raw||p.name).replace(/\.[^.]+$/,'')}
function cliLink(p){var u=(S.cfg.clink||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u.replace(/\{foto\}/g,encodeURIComponent(cliCode(p))).replace(/\{peito\}/g,encodeURIComponent((p.bibs||[])[0]||''))}
async function cliOpen(p){p=p||curP();if(!p||CLI)return;var link=cliLink(p);
var el=document.createElement('div');el.className='cliv';el.setAttribute('role','dialog');el.setAttribute('aria-label','Mostrar a foto ao cliente');
el.innerHTML='<div class="clipic"><canvas aria-label="Foto"></canvas><div class="fsload">Preparando a foto…</div></div><div class="clipanel">'+(S.cfg.ev||S.proj.name?'<div class="cliev">'+esc(S.cfg.ev||S.proj.name)+'</div>':'')+
(link?'<div class="cliqr"></div><b class="clih">Aponte a câmera do celular</b><p>O link abre a página para ver e comprar a sua foto.</p>':'<b class="clih">Falta o link de venda</b><p>Coloque o link do evento em Config › Venda na hora.</p>')+
'<div class="clicode"><small>Foto nº</small><b>'+esc(cliCode(p))+'</b>'+((p.bibs||[]).length?'<small>Peito</small><b>'+esc(p.bibs.join(' · '))+'</b>':'')+'</div>'+(S.cfg.preco?'<div class="clipr">R$ '+esc(S.cfg.preco)+'</div>':'')+'<button type="button" data-clx="1">✕ Fechar</button></div>';
document.body.appendChild(el);CLI={el:el,p:p};
if(link){var qb=el.querySelector('.cliqr');try{var qc=QR.canvas(link,480);qc.setAttribute('role','img');qc.setAttribute('aria-label','QR Code do link de venda');qb.appendChild(qc)}catch(er){qb.textContent=link}}
var cv=el.querySelector('canvas'),ld=el.querySelector('.fsload');
try{var c=await imgCanvas(p.vid?p.thumb:p.orig,1800),o=c;if(!p.vid){await attachSeg(p);o=await proc(c,c.width,c.height,p.e)}if(!CLI)return;cv.width=o.width;cv.height=o.height;cv.getContext('2d').drawImage(o,0,0);if(wmOn())drawWM(cv)}catch(er){}
if(CLI)ld.hidden=true}
function cliClose(){if(!CLI)return;CLI.el.remove();CLI=null}
document.addEventListener('click',function(e){if(!CLI)return;if(e.target.closest('[data-clx]'))cliClose()});

/* ---------- alerta de olhos fechados ---------- */
function earOf(pts){var d=function(a,b){return Math.hypot(a.x-b.x,a.y-b.y)},w=d(pts[0],pts[3]);return w?(d(pts[1],pts[5])+d(pts[2],pts[4]))/(2*w):1}
async function eyesRun(){if(S.eyesBusy){S.eyesStop=true;return}var L=live().filter(function(p){return!p.vid&&p.eyes==null});
if(!L.length){toast('Todas as fotos já foram verificadas');return}
var fa;S.eyesBusy=true;S.eyesStop=false;S.eyesN=0;S.eyesT=L.length;render();
try{toast('Carregando a detecção de rosto…');fa=await Promise.race([faceLib(),new Promise(function(_,r){setTimeout(function(){r('t')},60000)})])}
catch(e){S.eyesBusy=false;render();toast('A verificação não carregou. Ela funciona no site e no app (precisa de internet na primeira vez).');return}
var opt=new fa.SsdMobilenetv1Options({minConfidence:.5}),found=0;
for(var i=0;i<L.length&&!S.eyesStop;i++){var p=L[i];try{var c=await imgCanvas(p.orig,1600),ds=await fa.detectAllFaces(c,opt).withFaceLandmarks().withFaceDescriptors();
if(!p.faces)p.faces=ds.map(function(d){return Array.from(d.descriptor,function(v){return Math.round(v*1e4)/1e4})});
var big=ds.reduce(function(m,d){return Math.max(m,d.detection.box.width)},0),closed=0;
ds.forEach(function(d){var b=d.detection.box;if(b.width<big*.5||b.width<c.width*.03)return;var lm=d.landmarks,e2=(earOf(lm.getLeftEye())+earOf(lm.getRightEye()))/2;if(e2<.19)closed++});
p.eyes=closed;if(closed)found++}catch(e){p.eyes=0}
S.eyesN++;if(S.tab==='rev'&&S.eyesN%3===0)render();await sleep(0)}
var stopped=S.eyesStop;S.eyesBusy=false;S.eyesStop=false;if(found)S.eyesF=true;render();saveSoon();
toast(found?found+(found>1?' fotos':' foto')+' com olhos fechados. O filtro 😑 está ligado.':stopped?'Verificação parada':'Nenhuma foto com olhos fechados')}

/* ---------- backup do evento ---------- */
function bkData(){var cf={};Object.keys(S.cfg).forEach(function(k){if(k!=='ftpPass')cf[k]=S.cfg[k]});
return{fotoreal:'backup',v:1,app:APP_VER,at:new Date().toISOString(),proj:{name:S.proj.name,cfg:cf},presets:upGet(),
photos:S.p.map(function(p){var m=metaOf(p);delete m.thumb;delete m.faces;m.key=p.key||'';return m})}}
function bkName(){var d=new Date(),z=function(n){return String(n).padStart(2,'0')};return'backup_'+slug(S.proj.name)+'_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+'.json'}
async function bkSave(){if(!S.p.length){toast('Este projeto ainda não tem fotos');return}var b=new Blob([JSON.stringify(bkData())],{type:'application/json'});
var ok=await dl(bkName(),b);if(ok)toast(isNative()?'Escolha “Salvar em Arquivos” e guarde no iCloud Drive':'Backup salvo')}
var BKT=0;function bkAuto(force){if(!isNative()||!S.p.length)return;var now=Date.now();if(!force&&now-BKT<60000)return;BKT=now;
try{natSave('backup-automatico.json',new Blob([JSON.stringify(bkData())],{type:'application/json'}),rtFolder())}catch(e){}}
function pendKey(){return'fotoreal:pend:'+S.proj.id}
function pendGet(){if(S.pendPj!==S.proj.id){S.pendPj=S.proj.id;try{S.pend=JSON.parse(localStorage.getItem(pendKey())||'null')}catch(e){S.pend=null}}return S.pend}
function pendSet(o){S.pend=o&&Object.keys(o).length?o:null;S.pendPj=S.proj.id;try{if(S.pend)localStorage.setItem(pendKey(),JSON.stringify(S.pend));else localStorage.removeItem(pendKey())}catch(e){}}
function bkApply(p,m){if(m.m!==undefined)p.m=m.m;p.st=m.st||0;p.t=m.t||'';p.bibs=m.bibs||[];p.done=!!m.done;p.out=m.out||null;if(m.eyes!=null)p.eyes=m.eyes;if(m.e){p.e=Object.assign(E0(),m.e);p.e.mk=m.e.mk||[]}}
function bkPend(np){var P=pendGet();if(!P)return;var k=np.key&&P[np.key]?np.key:(P['n:'+(np.raw||np.name)]?'n:'+(np.raw||np.name):null);if(!k)return;var m=P[k];bkApply(np,m);
var Q=Object.assign({},P);delete Q[m.key||k];delete Q['n:'+(m.raw||m.name)];pendSet(Q)}
async function bkRestore(file){var b;try{b=JSON.parse(await file.text())}catch(e){toast('Esse arquivo não é um backup do FOTO REAL');return}
if(!b||b.fotoreal!=='backup'||!Array.isArray(b.photos)){toast('Esse arquivo não é um backup do FOTO REAL');return}
if(b.proj&&b.proj.cfg){var keep={ftpPass:S.cfg.ftpPass,rc:S.cfg.rc};Object.assign(S.cfg,b.proj.cfg,keep);saveCfg();snapCfg();loadWmImg()}
if(Array.isArray(b.presets)&&b.presets.length){var U=upGet(),ids={};U.forEach(function(x){ids[x.id]=1});b.presets.forEach(function(x){if(x&&x.id&&!ids[x.id])U.push(x)});upSet(U)}
var byKey={},byName={};S.p.forEach(function(p){if(p.key)byKey[p.key]=p;byName[p.raw||p.name]=p});
var hit=0,P=Object.assign({},pendGet()||{});
b.photos.forEach(function(m){var p=(m.key&&byKey[m.key])||byName[m.raw||m.name];if(p){bkApply(p,m);hit++}else{P[m.key||('n:'+(m.raw||m.name))]=m;if(m.key)P['n:'+(m.raw||m.name)]=m}});
var miss=b.photos.length-hit;pendSet(miss?P:null);render();saveSoon();
toast('Backup restaurado: '+hit+(hit===1?' foto ajustada':' fotos ajustadas')+(miss?'. Faltam '+miss+': importe do cartão e elas se ajustam sozinhas.':''))}
function pendCount(){var P=pendGet();if(!P)return 0;var n=0;Object.keys(P).forEach(function(k){if(k.indexOf('n:')!==0||!P[k].key)n++});return n}
(function(){var i=document.createElement('input');i.type='file';i.id='bkfile';i.accept='.json,application/json';i.hidden=true;document.body.appendChild(i);
i.addEventListener('change',function(){var f=this.files&&this.files[0];this.value='';if(f)bkRestore(f)})})();

/* ---------- memória: depois de guardar, usa a cópia do disco ---------- */
async function swapIdb(p){try{var d=await idb(),bl=await new Promise(function(res,rej){var tx=d.transaction('files','readonly'),rq=tx.objectStore('files').get(p.id);rq.onsuccess=function(){res(rq.result)};rq.onerror=function(){rej(rq.error)}});
if(!bl||!p.file||bl.size!==p.file.size||bl===p.file)return;var f=bl instanceof File?bl:new File([bl],p.name,{type:bl.type||p.file.type});var old=p.orig;p.file=f;p.orig=URL.createObjectURL(f);setTimeout(function(){try{URL.revokeObjectURL(old)}catch(e){}},10000)}catch(e){}}

S.natN=(S.natN||0)+1;S.natLast=name;importCard([f],true);while(S.q.length>2)await sleep(150)}catch(e){toast('Não recebi '+name)}natPost({cmd:'inDone',id:id})})};

render()});
