workflows:
  foto-real-teste:
    name: FOTO REAL - teste (sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Instalar o XcodeGen
        script: brew install xcodegen
      - name: Gerar o projeto
        script: xcodegen generate
      - name: Compilar o app
        script: |
          set -o pipefail
          xcodebuild -project FotoReal.xcodeproj -scheme FotoReal -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Gerar o arquivo .ipa
        script: |
          rm -rf Payload FotoReal.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FotoReal.app Payload/
          zip -qry FotoReal.ipa Payload
    artifacts:
      - FotoReal.ipa
