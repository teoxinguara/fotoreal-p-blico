  else if(d.a==="all"){pp=S.p.find(function(x){return x.id===S.sel});S.p.forEach(function(x){x.e=JSON.parse(JSON.stringify(pp.e))});toast("Ajustes copiados para todas")}
  render()});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.sl){var p=S.p.find(function(x){return x.id===S.sel});p.e[t.dataset.sl]=+t.value;$("prev").style.filter="";drawPrev();t.previousElementSibling.lastChild.textContent=t.value}
  if(t.dataset.split){S.split=+t.value;var po=$('prev');if(po)po.style.clipPath='inset(0 0 0 '+t.value+'%)';var dv=document.querySelector('.dv');if(dv)dv.style.left=t.value+'%'}if(t.dataset.mka||t.dataset.mkf||t.dataset.bs){var pm=S.p.find(function(x){return x.id===S.sel}),mm=pm&&curMask(pm);if(t.dataset.bs)S.bs=+t.value;else if(mm){if(t.dataset.mka)mm.a[t.dataset.mka]=+t.value;else mm.f=+t.value}t.previousElementSibling.lastChild.textContent=t.value;drawPrev()}if(t.dataset.pt){var pq=S.p.find(function(x){return x.id===S.sel});if(pq)pq.t=t.value}if(t.dataset.f2){S.cfg[t.dataset.f2]=t.value;saveCfg()}if(t.dataset.cf){S.cfg[t.dataset.cf]=+t.value;saveCfg();$(t.dataset.cf==="foco"?"vf":"ve").textContent=t.value}});
$("pfile").addEventListener("change",async function(){var fs=Array.prototype.slice.call(this.files||[]);this.value="";var ok=0,last=null;
for(var i=0;i<fs.length;i++){try{var pr=parsePreset(await fs[i].text(),fs[i].name),L=upGet();L.unshift(pr);upSet(L);ok++;last=pr}catch(e){toast("Não consegui ler "+fs[i].name)}}
if(last){var pp=curP();if(pp)pp.e=Object.assign(E0(),last.v,{mk:pp.e.mk,r:pp.e.r,ang:pp.e.ang,asp:pp.e.asp});toast(ok>1?ok+" presets importados":'Preset "'+last.n+'" importado e aplicado');render()}});
$("file").addEventListener("change",function(){
  var f=Array.prototype.slice.call(this.files);this.value="";if(!f.length)return;
  S.q=S.q.concat(f);S.tot+=f.length;toast(f.length+" foto(s) na fila");render();run()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
