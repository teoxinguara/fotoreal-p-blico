name: FotoReal
options:
  bundleIdPrefix: com.fotoreal
  deploymentTarget:
    iOS: "16.0"
targets:
  FotoReal:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: FotoReal
        PRODUCT_BUNDLE_IDENTIFIER: com.fotoreal.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
